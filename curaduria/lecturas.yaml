# Lecturas rápidas y Recorridos recomendados de recursos-ai.liqueed.org
#
# Este archivo es la fuente de las páginas /lecturas-rapidas y /recorridos-recomendados,
# de la sección de llms.txt y de /recorridos.json. Lo lee plugins/liqueed-explorar/dist/lecturas.js
# en el build.
#
# Cómo se mantiene (armado híbrido, aprobado por Ari el 25/11/2026):
# 1. Faro propone altas, bajas o cambios en el digest del lunes, numerados como las candidatas.
# 2. Ari responde por número. Solo lo aprobado se escribe acá, en el mismo PR de las fichas del digest.
# 3. Reglas para proponer: ver curaduria/rubrica.md, sección "Lecturas rápidas y recorridos".
#
# Cada ítem apunta a una ficha por el nombre de su archivo en vault/fuentes/ (sin .md), igual que un [[link]].
# Los minutos de la ficha y de la fuente salen del frontmatter de cada ficha (minutos, minutos_origen);
# los totales los calcula el build, que avisa si un paquete se pasa del tiempo que promete.
# Perfiles: tecnico | producto | cultura-organizacion. Madurez: explorando | experimentando | escalando.
# Máximo 5 lecturas rápidas en la página, con 3 a 5 lecturas cada una.
# Textos (pedido de Ari, 25/11/2026): cortos, sobrios y verificables. Nada que suponga la etapa de la
# organización de quien lee ni prometa resultados. `minutos` va en la tarjeta, no en el título.

revisado: 2026-11-25

lecturas_rapidas:
  - id: adopcion-10
    titulo: "Adopción de IA"
    minutos: 10
    perfil: [tecnico, producto, cultura-organizacion]
    descripcion: "Champions, la mirada de IT y primeros pasos en un área."
    items:
      - ficha: "Abundly - The Power of Anointing Gen AI Champions"
        por_que: "El rol de los champions en la adopción."
      - ficha: "Aaron Levie - Lo que dicen los líderes de IT sobre agentes"
        por_que: "Qué preocupa a líderes de IT: cambio, costos y sistemas legados."
      - ficha: "Matías Frydman - Cinco pasos para adoptar IA en un área"
        por_que: "Cinco pasos para empezar en un área. En español."

  - id: variado-15
    titulo: "Panorama general"
    minutos: 15
    perfil: [tecnico, producto, cultura-organizacion]
    descripcion: "Una lectura de producto, cultura, medición, roles y técnica."
    items:
      - ficha: "Félix López - ProtoAIpos"
        por_que: "Prototipar con IA antes de decidir qué construir."
      - ficha: "HBR - When Using AI Leads to Brain Fry"
        por_que: "El costo cognitivo de usar IA de forma intensiva."
      - ficha: "Dan Shipper - We need to change how we measure AI"
        por_que: "Por qué los benchmarks no alcanzan para medir utilidad."
      - ficha: "Boris Cherny - Cinco arquetipos de roles de producto"
        por_que: "Cinco arquetipos posibles para los roles de producto."
      - ficha: "Santi - Cuándo usar un workflow y cuándo un agente"
        por_que: "Workflow o agente: cuándo conviene cada uno. En español."

  - id: producto-20
    titulo: "Producto"
    minutos: 20
    perfil: [producto]
    descripcion: "El rol de producto y el prototipado con IA."
    items:
      - ficha: "Marty Cagan - AI and the Future of the Product Role"
        por_que: "Qué cambia y qué no en el rol, según Cagan."
      - ficha: "Christina Wodtke - I'll Know It When I Build It"
        por_que: "El prototipo como herramienta de discovery."
      - ficha: "Félix López - ProtoAIpos"
        por_que: "Un caso de prototipado con IA. En español."
      - ficha: "Boris Cherny - Cinco arquetipos de roles de producto"
        por_que: "Cinco arquetipos posibles para los roles de producto."

  - id: tecnico-20
    titulo: "Desarrollo con agentes"
    minutos: 20
    perfil: [tecnico]
    descripcion: "Qué cambió en los modelos y cómo se trabaja con agentes."
    items:
      - ficha: "Simon Willison - Three LLM inflection points in twelve months"
        por_que: "Tres saltos de los modelos en el último año."
      - ficha: "Martin Fowler - Exploring Generative AI"
        por_que: "La serie de martinfowler.com sobre IA en el desarrollo de software."
      - ficha: "Santi - Cuándo usar un workflow y cuándo un agente"
        por_que: "Workflow o agente: cuándo conviene cada uno. En español."
      - ficha: "Santi - Flujo para construir software con agentes"
        por_que: "Un flujo de trabajo con agentes de código. En español."

  - id: gobernanza-30
    titulo: "Gobernanza de IA"
    minutos: 30
    perfil: [tecnico, producto, cultura-organizacion]
    descripcion: "El Reglamento europeo, guías para cumplirlo y un caso."
    items:
      - ficha: "Comisión Europea - Ley de IA"
        por_que: "Niveles de riesgo y calendario, de la fuente oficial."
      - ficha: "AESIA - Guías prácticas para el cumplimiento del RIA"
        por_que: "Guías y checklists por requisito. En español."
      - ficha: "Félix López - Nuestra estrategia para la adopción de IA"
        por_que: "Cómo una organización aprueba herramientas con límites de datos y seguridad."

recorridos:
  - id: producto-primeros-pasos
    titulo: "Producto"
    perfil: [producto]
    madurez: explorando
    descripcion: "Fundamentos, el rol de producto y el prototipado con IA."
    pasos:
      - ficha: "Henrik Kniberg - Generative AI in a Nutshell"
        por_que: "Qué es la IA generativa, sin jerga."
      - ficha: "Marty Cagan - AI and the Future of the Product Role"
        por_que: "Qué cambia en el rol de producto."
      - ficha: "Grey - AI Makes It Easier to Build the Wrong Product"
        por_que: "El riesgo de construir rápido algo que nadie necesita."
      - ficha: "Christina Wodtke - I'll Know It When I Build It"
        por_que: "El prototipo como herramienta de discovery."
      - ficha: "Félix López - ProtoAIpos"
        por_que: "Un caso de prototipado con IA. En español."
    para_profundizar:
      - ficha: "Sherif Mansour - First principles PM in the AI era"
        por_que: "Entrevista sobre el trabajo de producto con IA."

  - id: tecnico-escalar-agentes
    titulo: "Técnico y CTO"
    perfil: [tecnico]
    madurez: escalando
    descripcion: "Adopción en ingeniería, entorno de agentes, evals y seguridad."
    pasos:
      - ficha: "Will Larson - Facilitating AI adoption at Imprint"
        por_que: "Cómo un CTO facilitó la adopción en su empresa."
      - ficha: "Rachel Laycock - Why are good developers so wary of agentic development"
        por_que: "Por qué muchos desarrolladores desconfían de los agentes."
      - ficha: "Birgitta Böckeler - Harness engineering for coding agent users"
        por_que: "Cómo configurar el entorno alrededor del agente."
      - ficha: "Uber - How Uber Evals 1 Million Agent Skill Invocations"
        por_que: "Cómo evalúa Uber sus agentes a gran escala."
      - ficha: "OWASP - Top 10 2025 de riesgos para LLMs y aplicaciones de IA generativa"
        por_que: "Diez riesgos de seguridad en aplicaciones con LLMs. En español."

  - id: cultura-adopcion-social
    titulo: "Cultura y RR. HH."
    perfil: [cultura-organizacion]
    madurez: experimentando
    descripcion: "Adopción entre pares, champions, desgaste y equipos ágiles."
    pasos:
      - ficha: "Daan van Rossum - People copy people"
        por_que: "La adopción se extiende entre colegas de confianza."
      - ficha: "Abundly - The Power of Anointing Gen AI Champions"
        por_que: "El rol de los champions en la adopción."
      - ficha: "Stanton, Shriber y Rudat - What Top Performers Do Differently with AI"
        por_que: "Qué hacen distinto quienes más aprovechan la IA."
      - ficha: "HBR - When Using AI Leads to Brain Fry"
        por_que: "El costo cognitivo de usar IA de forma intensiva."
      - ficha: "Henrik Kniberg - Agile in the Age of AI"
        por_que: "Qué cambia en los equipos y roles ágiles."
    para_profundizar:
      - ficha: "liqueed - Programa AI Champion"
        por_que: "Nuestro programa de dos días para champions."

  - id: gobernanza-sin-frenar
    titulo: "Gobernanza"
    perfil: [cultura-organizacion, tecnico, producto]
    madurez: escalando
    descripcion: "Regulación europea, guías de cumplimiento y marcos de gestión de riesgos."
    pasos:
      - ficha: "Comisión Europea - Ley de IA"
        por_que: "Niveles de riesgo, obligaciones y calendario."
      - ficha: "AESIA - Guías prácticas para el cumplimiento del RIA"
        por_que: "Guías y checklists por requisito. En español."
      - ficha: "IMDA - Model AI Governance Framework for Agentic AI"
        por_que: "Marco para gobernar sistemas con agentes."
      - ficha: "NIST - Perfil de IA generativa del AI RMF"
        por_que: "Doce riesgos de la IA generativa y acciones para gestionarlos."
    para_profundizar:
      - ficha: "GDS - AI Playbook for the UK Government"
        por_que: "Diez principios para usar IA en el gobierno británico."

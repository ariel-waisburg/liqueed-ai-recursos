# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: Recursos de IA · liqueed
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  locale: es-ES
  # GA4 de liqueed.org (G-1EWL68QK9C, visible en el HTML público del sitio).
  # Mide en la propiedad "web liqueed" (514773822); en los reportes se separa por hostName = ariel-waisburg.github.io.
  # No mide en localhost/127.0.0.1 (ver quartz/plugins/emitters/componentResources.ts).
  # Para apagar analytics: `analytics: null`.
  analytics:
    provider: google
    tagId: G-1EWL68QK9C
  baseUrl: ariel-waisburg.github.io/liqueed-ai-recursos
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      # Estética AI Champion de liqueed: Poppins en títulos, Public Sans en texto y en etiquetas
      # (mayúsculas con tracking, semibold).
      # REGLA DE MARCA: IBM Plex Mono NO se usa en ningún lado del sitio (pedido de Ari). No la vuelvas a
      # poner acá ni la cargues desde CSS o plugins. `code` es Public Sans solo para que no se descargue
      # ninguna monoespaciada (Quartz y quartz-fonts usan IBM Plex Mono si `code` falta); los bloques de
      # código usan la monoespaciada del sistema (override de --codeFont en quartz/styles/custom.scss).
      header: Poppins
      body: Public Sans
      code: Public Sans
    colors:
      lightMode:
        # champion-paper, champion-ink, champion-blue, champion-orange, champion-yellow
        light: "#f4f1eb"
        lightgray: "#e0dbd0"
        gray: "#8f8a80"
        darkgray: "#2f3a45"
        dark: "#141e28"
        secondary: "#234d96"
        tertiary: "#e2531f"
        highlight: rgba(35, 77, 150, 0.07)
        textHighlight: "#fedc0f88"
      darkMode:
        light: "#101a24"
        lightgray: "#24313f"
        gray: "#6f7c8a"
        darkgray: "#d3d9e0"
        dark: "#f4f1eb"
        secondary: "#25a6df"
        tertiary: "#fedc0f"
        highlight: rgba(37, 166, 223, 0.12)
        textHighlight: "#fedc0f55"
  links:
    markdownLinkResolution: shortest
  contentIndex:
    enableSiteMap: true
    # El RSS lo genera plugins/liqueed-site (solo fichas, no páginas de carpeta).
    enableRSS: false
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
      comments: true
      highlight: true
      wikilinks: true
      callouts: true
      mermaid: true
      parseTags: true
      parseBlockReferences: true
      enableYouTubeEmbed: true
      enableVideoEmbed: true
    order: 40
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 30
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/citations"
    enabled: false
    order: 85
  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91
  - source: "@quartz-community/roam"
    enabled: false
    order: 92
  - source: "@quartz-community/quartz-fonts"
    enabled: true
  # Desactivado: su paleta (violeta/amarillo) pisaba los colores de liqueed. Los estilos propios están en quartz/styles/custom.scss.
  - source: "@quartz-themes/core"
    enabled: false
    options:
      theme: default
      mode: both
  - source: "@quartz-community/explicit-publish"
    enabled: false
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  - source: "@quartz-community/encrypted-pages"
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
  - source: "@quartz-community/stacked-pages"
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: true
  - source: "@quartz-community/cname"
    enabled: true
  - source: "@quartz-community/canvas-page"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  - source: "@quartz-community/explorer"
    enabled: true
    layout:
      position: left
      priority: 50
  - source: "@quartz-community/graph"
    enabled: true
    layout:
      position: right
      priority: 10
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: right
      priority: 50
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: "@quartz-community/tag-list"
    enabled: true
    layout:
      position: beforeBody
      priority: 30
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: "@quartz-community/reader-mode"
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/comments"
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: "@quartz-community/footer"
    enabled: false
    options:
      links:
        Hecho con Quartz: https://quartz.jzhao.xyz
    layout:
      position: footer
      priority: 50
  - source: "@quartz-community/recent-notes"
    enabled: false
  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "@quartz-community/bases-page"
    enabled: true
    options: {}
    order: 50
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: true
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: "@quartz-community/obsidian-plugin-excalidraw"
    enabled: true
    options:
      enableInteraction: true
      darkMode: auto
      exportPadding: 20
    order: 50
  # --- Plugins locales de liqueed (ver plugins/README.md) ---
  - source: ./plugins/liqueed-brand
    enabled: true
    options:
      href: https://liqueed.org
      label: liqueed
    layout:
      position: left
      priority: 5
  - source: ./plugins/liqueed-hero
    enabled: true
    options:
      serviciosUrl: https://servicios.liqueed.org/ia
    layout:
      position: beforeBody
      priority: 1
  - source: ./plugins/liqueed-cta
    enabled: true
    options:
      serviciosUrl: https://servicios.liqueed.org/ia
      # Link de "Agendar una conversación" de servicios.liqueed.org/ia
      agendaUrl: https://calendar.app.google/CAiHee2GU6LagupaA
      # Embed oficial de Kit del newsletter de liqueed.
      kitUid: 7bc27ec38d
      kitSrc: https://liqueed.kit.com/7bc27ec38d/index.js
    layout:
      position: afterBody
      priority: 80
  - source: ./plugins/liqueed-explorar
    enabled: true
    # order 15: su transformer corre después de created-modified-date (10) y pone la fecha del recurso.
    order: 15
    options:
      siteTitle: Recursos de IA · liqueed
    layout:
      position: afterBody
      priority: 10
  - source: ./plugins/liqueed-site
    enabled: true
    options:
      siteTitle: Recursos de IA · liqueed
      temaOrder:
        - Adopción de IA en organizaciones
        - Producto en la era de la IA
        - Desarrollo con agentes
        - Agentes y evals
        - Pensamiento crítico y delegación
        - Agilidad e IA
        - Fundamentos técnicos de IA
        - Gobernanza de IA
    layout:
      position: footer
      priority: 50
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}
